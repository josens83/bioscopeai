name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        type: string

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # =============================================
  # 배포 준비
  # =============================================
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT
          fi

      - name: Print deployment info
        run: |
          echo "🚀 Deploying to: ${{ github.event.inputs.environment }}"
          echo "📦 Version: ${{ steps.version.outputs.version }}"

  # =============================================
  # 빌드
  # =============================================
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bioscopeai-backend:${{ needs.prepare.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/bioscopeai-backend:${{ needs.prepare.outputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bioscopeai-frontend:${{ needs.prepare.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/bioscopeai-frontend:${{ needs.prepare.outputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ needs.prepare.outputs.environment == 'production' && secrets.PROD_API_URL || secrets.STAGING_API_URL }}

  # =============================================
  # 스테이징 배포
  # =============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.bioscopeai.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/bioscopeai
            docker compose pull
            docker compose up -d --force-recreate
            docker system prune -f

      - name: Health check
        run: |
          sleep 30
          curl -f https://staging.bioscopeai.com/api/v1/health || exit 1

      - name: Notify success
        if: success()
        run: |
          echo "✅ Staging deployment successful!"
          echo "🔗 URL: https://staging.bioscopeai.com"

  # =============================================
  # 프로덕션 배포
  # =============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.environment == 'production'
    environment:
      name: production
      url: https://bioscopeai.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/bioscopeai

            # Blue-green deployment
            docker compose -f docker-compose.prod.yml pull

            # Rolling update with zero downtime
            docker compose -f docker-compose.prod.yml up -d --no-deps --scale backend=2 backend
            sleep 30
            docker compose -f docker-compose.prod.yml up -d --no-deps --scale backend=1 backend

            docker compose -f docker-compose.prod.yml up -d --no-deps frontend

            # Cleanup
            docker system prune -f

      - name: Health check
        run: |
          sleep 30
          curl -f https://bioscopeai.com/api/v1/health || exit 1

      - name: Create release tag
        if: success() && github.event.inputs.version != ''
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ needs.prepare.outputs.version }}',
              name: 'Release ${{ needs.prepare.outputs.version }}',
              body: 'Production deployment of ${{ needs.prepare.outputs.version }}',
              draft: false,
              prerelease: false
            });

      - name: Notify success
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          echo "🔗 URL: https://bioscopeai.com"
          echo "📦 Version: ${{ needs.prepare.outputs.version }}"
