name: ✨ 기능 요청
description: 새로운 기능이나 개선 사항을 제안해주세요!
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        기능 제안을 해주셔서 감사합니다! 💡
        아이디어를 공유해주세요.

  - type: textarea
    id: problem
    attributes:
      label: 문제 또는 니즈
      description: 이 기능이 필요한 이유가 무엇인가요?
      placeholder: 어떤 문제를 해결하고 싶으신가요?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결책
      description: 어떤 기능이 추가되면 좋을까요?
      placeholder: 원하시는 기능을 자세히 설명해주세요
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려해본 다른 대안이 있나요?
      placeholder: 다른 접근 방법이 있다면 알려주세요
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      description: 이 기능이 얼마나 중요한가요?
      options:
        - 낮음 - 있으면 좋음
        - 보통 - 유용할 것 같음
        - 높음 - 꼭 필요함
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      description: 어떤 영역과 관련된 기능인가요?
      multiple: true
      options:
        - 프론트엔드 (웹)
        - 모바일 앱
        - 백엔드 API
        - AI/분석
        - 인증/보안
        - 결제/구독
        - 문서/튜토리얼
        - 기타
    validations:
      required: true

  - type: textarea
    id: mockup
    attributes:
      label: 목업/참고 자료
      description: 참고할 만한 이미지나 링크가 있나요?
      placeholder: 이미지를 드래그하거나 URL을 붙여넣기 하세요
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 다른 추가할 내용이 있나요?
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: 기여 의향
      description: 이 기능 개발에 참여하실 의향이 있으신가요?
      options:
        - label: 이 기능 개발에 기여하고 싶습니다
